name: M3 production release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Manually approved release stage
        required: true
        type: choice
        options:
          - draft-recovery
          - production
      source_sha:
        description: Exact private source commit
        required: true
      sequence:
        description: Monotonic release sequence (production only)
        required: false
      recovery_x86_64_sha256:
        description: Returned offline-signed x86_64 recovery SHA-256
        required: false
      recovery_aarch64_sha256:
        description: Returned offline-signed aarch64 recovery SHA-256
        required: false

permissions:
  actions: read
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Require owner dispatch from exact main SHA with native CI
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHER: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          WORKFLOW_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_STAGE: ${{ inputs.stage }}
          SEQUENCE: ${{ inputs.sequence }}
        run: |
          test "${DISPATCHER,,}" = "${REPOSITORY_OWNER,,}"
          test "$WORKFLOW_REF" = refs/heads/main
          test "${#SOURCE_SHA}" -eq 40
          case "$SOURCE_SHA" in *[!0-9a-f]*) exit 1;; esac
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/runs?head_sha=${SOURCE_SHA}&branch=main&event=push&status=success&per_page=10" > ci-runs.json
          jq -e --arg sha "$SOURCE_SHA" '.workflow_runs | any(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")' ci-runs.json
          gh api --method GET "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...main" > comparison.json
          jq -e '.status == "identical"' comparison.json
          for environment in offline-recovery-draft production-release; do
            gh api "repos/${GITHUB_REPOSITORY}/environments/${environment}" > "${environment}.json"
            jq -e '.deployment_branch_policy.custom_branch_policies == true and .deployment_branch_policy.protected_branches == false' "${environment}.json"
            gh api "repos/${GITHUB_REPOSITORY}/environments/${environment}/deployment-branch-policies" > "${environment}-branches.json"
            jq -e '.total_count == 1 and (.branch_policies | length == 1) and .branch_policies[0].name == "main" and (.branch_policies[0].type // "branch") == "branch"' "${environment}-branches.json"
          done
          gh api --method GET "repos/KZagaja/zeroOS-releases/releases?per_page=100" > releases.json
          if test "$RELEASE_STAGE" = production; then
            case "$SEQUENCE" in *[!0-9]*|'') exit 1;; esac
            next="$(jq '[.[].tag_name | capture("^sequence-(?<number>[0-9]+)$")? | .number | tonumber] | max // 0 | . + 1' releases.json)"
            test "$SEQUENCE" = "$next"
            ! jq -e --arg tag "sequence-${SEQUENCE}" 'any(.[]; .tag_name == $tag)' releases.json
            ! jq -e --arg tag "candidate-sequence-${SEQUENCE}" 'any(.[]; .tag_name == $tag)' releases.json
          else
            ! jq -e --arg tag "recovery-${SOURCE_SHA}" 'any(.[]; .tag_name == $tag)' releases.json
          fi

  recovery-build:
    if: inputs.stage == 'draft-recovery'
    needs: source-preflight
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    environment: offline-recovery-draft
    steps:
      - name: Require release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
        run: test -n "$RELEASE_TOKEN"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - run: (cd policy/m3-trust && sha256sum --check fingerprints.sha256)
      - run: docker build --pull=false --tag zeroos-build .
      - run: docker run --rm --volume "$PWD:/work" zeroos-build cargo xtask test --arch ${{ matrix.arch }}
      - name: Prepare unsigned recovery payload
        run: |
          cp "target/m3/${{ matrix.arch }}/kernel.efi" "zeroos-recovery-${{ matrix.arch }}-unsigned.efi"
          sha256sum "zeroos-recovery-${{ matrix.arch }}-unsigned.efi" > "zeroos-recovery-${{ matrix.arch }}-unsigned.efi.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-${{ matrix.arch }}
          path: zeroos-recovery-${{ matrix.arch }}-unsigned.efi*

  recovery-draft:
    if: inputs.stage == 'draft-recovery'
    needs: recovery-build
    runs-on: ubuntu-24.04
    environment: offline-recovery-draft
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: recovery-*
          merge-multiple: true
      - name: Publish draft for offline signing
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
        run: |
          gh release create "recovery-${{ inputs.source_sha }}" --draft zeroos-recovery-*-unsigned.efi* --repo KZagaja/zeroOS-releases --title "Unsigned recovery ${{ inputs.source_sha }}" --notes "Offline signing input built from source ${{ inputs.source_sha }}"

  production-build:
    if: inputs.stage == 'production'
    needs: source-preflight
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - run: (cd policy/m3-trust && sha256sum --check fingerprints.sha256)
      - run: docker build --pull=false --tag zeroos-build .
      - run: docker run --rm --volume "$PWD:/work" zeroos-build cargo xtask test --arch ${{ matrix.arch }}
      - name: Prepare unsigned production inputs
        run: |
          cp "target/m3/${{ matrix.arch }}/selector.efi" "zeroos-selector-${{ matrix.arch }}-unsigned.efi"
          cp "target/m3/${{ matrix.arch }}/kernel.efi" "zeroos-system-${{ matrix.arch }}-unsigned.efi"
          sha256sum "zeroos-selector-${{ matrix.arch }}-unsigned.efi" "zeroos-system-${{ matrix.arch }}-unsigned.efi" > "zeroos-unsigned-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-production-${{ matrix.arch }}
          path: |
            zeroos-selector-${{ matrix.arch }}-unsigned.efi
            zeroos-system-${{ matrix.arch }}-unsigned.efi
            zeroos-unsigned-${{ matrix.arch }}.sha256

  production-sign:
    if: inputs.stage == 'production'
    needs: production-build
    runs-on: [self-hosted, Linux, X64, zeroos-production]
    environment: production-release
    steps:
      - name: Require release token and pinned signer
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          SIGNER_VERSION: ${{ vars.ZEROOS_SIGN_VERSION }}
          SIGNER_SHA256: ${{ vars.ZEROOS_SIGN_X86_64_SHA256 }}
        run: |
          test -n "$RELEASE_TOKEN"
          test -n "$SIGNER_VERSION"
          test "${#SIGNER_SHA256}" -eq 64
          case "$SIGNER_SHA256" in *[!0-9a-f]*) exit 1;; esac
          signer="$(command -v zeroos-sign)"
          test "$(zeroos-sign --version)" = "$SIGNER_VERSION"
          test "$(sha256sum "$signer" | cut -d' ' -f1)" = "$SIGNER_SHA256"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - run: (cd policy/m3-trust && sha256sum --check fingerprints.sha256)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: unsigned-production-*
          merge-multiple: true
      - name: Verify native build artifacts and production inputs
        env:
          SEQUENCE: ${{ inputs.sequence }}
          RECOVERY_X86_64_SHA256: ${{ inputs.recovery_x86_64_sha256 }}
          RECOVERY_AARCH64_SHA256: ${{ inputs.recovery_aarch64_sha256 }}
        run: |
          case "$SEQUENCE" in *[!0-9]*|'') exit 1;; esac
          for digest in "$RECOVERY_X86_64_SHA256" "$RECOVERY_AARCH64_SHA256"; do
            test "${#digest}" -eq 64
            case "$digest" in *[!0-9a-f]*) exit 1;; esac
          done
          sha256sum --check zeroos-unsigned-x86_64.sha256
          sha256sum --check zeroos-unsigned-aarch64.sha256
      - name: Fetch and verify offline-signed recovery
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
          RECOVERY_X86_64_SHA256: ${{ inputs.recovery_x86_64_sha256 }}
          RECOVERY_AARCH64_SHA256: ${{ inputs.recovery_aarch64_sha256 }}
        run: |
          for arch in x86_64 aarch64; do
            gh release download "recovery-${{ inputs.source_sha }}" --repo KZagaja/zeroOS-releases --pattern "zeroos-recovery-${arch}.efi"
            if test "$arch" = x86_64; then expected="$RECOVERY_X86_64_SHA256"; else expected="$RECOVERY_AARCH64_SHA256"; fi
            test "$(sha256sum "zeroos-recovery-${arch}.efi" | cut -d' ' -f1)" = "$expected"
            zeroos-sign verify-recovery --arch "$arch" --payload "zeroos-recovery-${arch}.efi"
          done
      - name: Sign through protected non-exporting signer
        run: |
          for arch in x86_64 aarch64; do
            zeroos-sign sign-efi --role selector --input "zeroos-selector-${arch}-unsigned.efi" --output "zeroos-selector-${arch}.efi"
            zeroos-sign sign-efi --role production --input "zeroos-system-${arch}-unsigned.efi" --output "zeroos-system-${arch}.efi"
            zeroos-sign package --arch "$arch" --sequence "${{ inputs.sequence }}" --payload "zeroos-system-${arch}.efi" --output "zeroos-${arch}.slot"
            sha256sum "zeroos-${arch}.slot" "zeroos-selector-${arch}.efi" "zeroos-system-${arch}.efi" "zeroos-recovery-${arch}.efi" > "zeroos-${arch}.sha256"
            zeroos-sign provenance --source "${{ inputs.source_sha }}" --arch "$arch" --sequence "${{ inputs.sequence }}" --hashes "zeroos-${arch}.sha256" --output "zeroos-${arch}.provenance.json"
            jq -e --arg source "${{ inputs.source_sha }}" '.source == $source and (.public_fingerprints | length > 0)' "zeroos-${arch}.provenance.json"
            while read -r fingerprint _; do
              jq -e --arg fingerprint "$fingerprint" '.public_fingerprints | any(ascii_downcase == ($fingerprint | ascii_downcase))' "zeroos-${arch}.provenance.json"
            done < policy/m3-trust/fingerprints.sha256
            ! grep -Eiq 'private[-_ ]?(key|material)|secret[-_ ]?(key|material)' "zeroos-${arch}.provenance.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zeroos-release
          path: |
            zeroos-x86_64.slot
            zeroos-aarch64.slot
            zeroos-x86_64.sha256
            zeroos-aarch64.sha256
            zeroos-x86_64.provenance.json
            zeroos-aarch64.provenance.json
            zeroos-selector-x86_64.efi
            zeroos-selector-aarch64.efi
            zeroos-system-x86_64.efi
            zeroos-system-aarch64.efi
            zeroos-recovery-x86_64.efi
            zeroos-recovery-aarch64.efi

  publish:
    if: inputs.stage == 'production'
    needs: production-sign
    runs-on: ubuntu-24.04
    environment: production-release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zeroos-release
      - name: Publish fixed-name assets to public artifact repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
        run: |
          gh release create "candidate-sequence-${{ inputs.sequence }}" zeroos-*.slot zeroos-*.sha256 zeroos-*.provenance.json zeroos-selector-*.efi zeroos-system-*.efi zeroos-recovery-*.efi --repo KZagaja/zeroOS-releases --prerelease --title "zeroOS sequence ${{ inputs.sequence }} candidate" --notes "Source ${{ inputs.source_sha }}"

  install-test:
    if: inputs.stage == 'production'
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    environment: production-release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - run: (cd policy/m3-trust && sha256sum --check fingerprints.sha256)
      - run: docker build --pull=false --tag zeroos-build .
      - name: Install and boot unauthenticated public release
        run: docker run --rm --volume "$PWD:/work" zeroos-build cargo xtask test-release --arch "${{ matrix.arch }}" --sequence "${{ inputs.sequence }}" --url "https://github.com/KZagaja/zeroOS-releases/releases/tag/candidate-sequence-${{ inputs.sequence }}" | tee "install-${{ matrix.arch }}.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-${{ matrix.arch }}
          path: |
            target/m3/${{ matrix.arch }}/qemu-release-*.log
            install-${{ matrix.arch }}.log

  promote:
    if: inputs.stage == 'production'
    needs: install-test
    runs-on: ubuntu-24.04
    environment: production-release
    steps:
      - name: Publish exact candidate bytes as latest production release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPOSITORY_TOKEN }}
        run: |
          gh release download "candidate-sequence-${{ inputs.sequence }}" --repo KZagaja/zeroOS-releases
          sha256sum --check zeroos-x86_64.sha256
          sha256sum --check zeroos-aarch64.sha256
          gh release create "sequence-${{ inputs.sequence }}" zeroos-*.slot zeroos-*.sha256 zeroos-*.provenance.json zeroos-selector-*.efi zeroos-system-*.efi zeroos-recovery-*.efi --repo KZagaja/zeroOS-releases --latest --title "zeroOS sequence ${{ inputs.sequence }}" --notes "Source ${{ inputs.source_sha }}; exact assets verified from immutable candidate-sequence-${{ inputs.sequence }}"
