name: M3

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build pinned toolchain image
        run: |
          docker build --pull=false --tag zeroos-build .
          echo "${{ matrix.arch }} build image $(docker image inspect zeroos-build --format '{{.Id}}')"
      - name: M0 regression gate
        run: docker run --rm --volume "$PWD:/work" zeroos-build cargo xtask check
      - name: M3 host acceptance
        run: docker run --rm --volume "$PWD:/work" zeroos-build cargo xtask test
      - name: M0-M2 regression and M3 native acceptance
        run: docker run --rm --volume "$PWD:/work" zeroos-build cargo xtask test --arch ${{ matrix.arch }}
