[workspace]
members = ["xtask", "init", "storage", "updater", "data", "selector"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LicenseRef-zeroOS-Proprietary"
publish = false
rust-version = "1.97.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
libc = "=0.2.184"
ring = "=0.17.14"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
zeroize = "=1.8.2"
